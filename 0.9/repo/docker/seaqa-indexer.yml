services:
  seaqa-indexer:
    image: ${SEATICKET_INDEXER_IMAGE:-docker.seafile.top/seafileltd/seaqa-indexer:0.2.0-testing}
    restart: unless-stopped
    container_name: seaqa-indexer
    #ports:
    #  - 8888:8888
    volumes:
      - ${SEATICKET_VOLUME:-/opt/seaticket/seaticket-data}/conf:/opt/seaticket/conf
      - ${SEATICKET_VOLUME:-/opt/seaticket/seaticket-data}:/shared
    environment:
      - LOG_TO_STDOUT=${LOG_TO_STDOUT:-false}
      - TZ=${TIME_ZONE:-UTC}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?Variable is not set or empty}
      - SECRET_KEY=${SECRET_KEY:?Variable is not set or empty}
      - SEADB_SERVER_URL=${SEADB_SERVER_URL:-http://seadb:8888}
      - SEADB_USER=${SEADB_USERNAME:-${INIT_SEATICKET_TEAM_ADMIN_EMAIL:?Variable is not set or empty}}
      - SEADB_PASSWORD=${SEADB_PASSWORD:-${INIT_SEATICKET_TEAM_ADMIN_PASSWORD:?Variable is not set or empty}}
      - MYSQL_DB_HOST=${MYSQL_DB_HOST:-db}
      - MYSQL_DB_PORT=${MYSQL_DB_PORT:-3306}
      - MYSQL_DB_USER=${MYSQL_DB_USER:-seaticket}
      - MYSQL_DB_PASSWORD=${MYSQL_DB_PASSWORD:?Variable is not set or empty}
      - MYSQL_DB_NAME=${MYSQL_DB_NAME:-seaticket_db}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SEASEARCH_URL=${SEASEARCH_URL:-http://seasearch:4080}
      - SEASEARCH_TOKEN=${SEASEARCH_TOKEN:?Variable is not set or empty}
      - S3_HOST=${S3_HOST:?Variable is not set or empty}
      - S3_FILE_BUCKET=${S3_FILE_BUCKET:?Variable is not set or empty}
      - S3_WEB_CRAWL_BUCKET=${S3_WEB_CRAWL_BUCKET:?Variable is not set or empty}
      - S3_KEY_ID=${S3_KEY_ID:?Variable is not set or empty}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?Variable is not set or empty}
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      seadb:
        condition: service_healthy
      seasearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/ || echo 000)
          [ "$$code" -ge 200 ] && [ "$$code" -lt 500 ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  backend-net:
    name: backend-net
