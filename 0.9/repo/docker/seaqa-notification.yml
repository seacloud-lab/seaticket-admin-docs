services:
  seaqa-notification:
    image: ${SEATICKET_NOTIFICATION_IMAGE:-docker.seafile.top/seafileltd/seaqa-notification:1.4.0-testing}
    restart: unless-stopped
    container_name: seaqa-notification
    #ports:
    #  - 8083:8083
    volumes:
      - ${SEATICKET_VOLUME:-/opt/seaticket/seaticket-data}/conf:/opt/seaticket/conf
      - ${SEATICKET_VOLUME:-/opt/seaticket/seaticket-data}:/shared
    environment:
      - LOG_TO_STDOUT=${LOG_TO_STDOUT:-false}
      - TZ=${TIME_ZONE:-UTC}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?Variable is not set or empty}
      - SEATICKET_CONFIG_NAME=${SEATICKET_CONFIG_NAME:-seaticket_config.yaml}
      - CONF_PATH=${CONF_PATH:-/opt/seaticket/conf}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      redis:
        condition: service_started
    labels:
      caddy: ${SEATICKET_SERVER_PROTOCOL:-http}://${SEATICKET_SERVER_HOSTNAME:?Variable is not set or empty}
      caddy.0_reverse_proxy: "/ws* {{upstreams 8083}}"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import socket; s = socket.create_connection(('127.0.0.1', 8083), 5); s.close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  frontend-net:
    name: frontend-net
  backend-net:
    name: backend-net
